<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomdoro timer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="container">
    <h1 class="time">Time left: 00:00</h1>
    <div class="buttons">
      <button class="start-btn" onclick="">Start</button>
      <button class="pause-btn">Pause</button>
      <button class="reset-btn">Reset</button>
    </div>
    <audio class="audio" src="tera.mp3"></audio>
        <input class="input" placeholder="How many minutes do you need?">

  </div>
</body>

</html>
